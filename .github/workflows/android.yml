name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android 15 build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test, lint, and build APKs
        run: >-
          ./gradlew :core:test :core:ktlintCheck :app:ktlintCheck
          :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
          --no-daemon --console=plain

      - name: Prepare phone download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/expense-tracker-debug.apk
          cd dist
          sha256sum expense-tracker-debug.apk > expense-tracker-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expense-tracker-debug-apk
          path: |
            dist/expense-tracker-debug.apk
            dist/expense-tracker-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-and-lint-reports
          path: |
            core/build/reports/tests/test/
            core/build/test-results/test/
            app/build/reports/lint-results-debug.*
            app/build/reports/ktlint/
            core/build/reports/ktlint/
          if-no-files-found: warn
          retention-days: 14
